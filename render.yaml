services:
  - type: web
    name: ursinger-backend
    runtime: node
    plan: starter
    autoDeploy: true
    rootDir: .
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start:prod:migrate
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ursinger-postgres
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: NODE_VERSION
        value: 22

databases:
  - name: ursinger-postgres
    plan: basic-256mb
    databaseName: ursinger_db
    user: ursinger_user
